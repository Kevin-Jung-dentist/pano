<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>League of Doctors · Admin</title><link rel="stylesheet" href="/play/play.css"><link rel="stylesheet" href="/play/landing.css"><link rel="stylesheet" href="/admin/admin.css"><script src="/play/locales/ko.js" defer></script><script src="/play/locales/en.js" defer></script><script src="/play/locales/ja.js" defer></script><script src="/play/locales/zh.js" defer></script><script src="/play/locales/es.js" defer></script><script src="/play/locales/it.js" defer></script><script src="/play/locales/fr.js" defer></script><script src="/play/i18n.js" defer></script><script src="/game-core.js" defer></script><script src="/admin/new/create.js" defer></script></head><body class="league-dark"><header><a class="brand" href="/">League of Doctors</a><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="es">Español</option><option value="it">Italiano</option><option value="fr">Français</option></select></header><main class="admin-main create-main"><a href="/admin/" data-i18n="backToDemos"></a><h1 data-i18n="addDemo"></h1><p data-i18n="createDemoIntro"></p><p id="create-status" role="status" aria-live="polite"></p><form id="create-demo-form" hidden>

<label><span data-i18n="country"></span><select id="demo-country" required></select></label>
<label class="full-width"><span data-i18n="university"></span><input id="demo-university" minlength="2" maxlength="120" required autocomplete="off" data-placeholder="demoUniversityHint"></label>
<label><span data-i18n="demoScoreLabel"></span><input id="demo-score" type="number" min="0" max="100" step="0.1" value="80" required></label>
<label><span data-i18n="demoRoundsLabel"></span><input id="demo-rounds" type="number" min="1" max="100000" step="1" value="1" required></label></div>
